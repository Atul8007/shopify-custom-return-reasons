# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "custom-return-reasons"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2027-01"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Access scopes:
# - write_orders: Required for creating & updating metafield definitions on ORDER via Admin API
# - customer_read_orders: Required for customer UI extension to query order & line item return state
# - customer_write_orders: Required for customer UI extension to write return requests and statuses
scopes = "write_orders,customer_read_orders,customer_write_orders"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

# App-owned order metafields (decided in Checkpoint 0)
[order.metafields.app.return_request]
name = "Return Request History"
description = "Readable history of return requests submitted for this order"
type = "multi_line_text_field"

  [order.metafields.app.return_request.access]
  customer_account = "read_write"
  admin = "merchant_read_write"

[order.metafields.app.return_data]
name = "Return Data"
description = "Structured JSON data tracking requested items and quantities"
type = "json"

  [order.metafields.app.return_data.access]
  customer_account = "read_write"
  admin = "merchant_read_write"

[order.metafields.app.return_status]
name = "Return Status"
description = "Status of the return request (Pending, Approved, Declined, Refunded)"
type = "single_line_text_field"

  [order.metafields.app.return_status.access]
  customer_account = "read_write"
  admin = "merchant_read_write"

  [order.metafields.app.return_status.capabilities]
  admin_filterable = true

